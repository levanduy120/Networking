<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký học - Duy Network Academy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar"><div class="container nav-inner"><a class="logo" href="/">Duy Network Academy</a><ul class="nav-links"><li><a href="/">Trang chủ</a></li><li><a href="/support-task.html">Support Task</a></li></ul></div></nav>
  <main class="page-main">
    <section class="content-hero">
      <div class="container">
        <a class="back-link" href="/">← Về trang chủ</a>
        <span class="eyebrow">Đăng ký học</span>
        <h1>Gửi thông tin để được tư vấn lộ trình</h1>
        <p>Trang này tách riêng khỏi support task. Nhu cầu học không dùng danh sách dịch vụ hỗ trợ kỹ thuật.</p>
      </div>
    </section>
    <section>
      <div class="container narrow">
        <form id="register-form" class="form js-ticket-form">
          <input type="hidden" name="service_id" data-default-service="Network Consulting">
          <div class="form-group"><label>Họ tên *</label><input name="customer_name" required></div>
          <div class="form-group"><label>Email *</label><input type="email" name="customer_email" required></div>
          <div class="form-group"><label>Số điện thoại/Zalo</label><input name="customer_phone"></div>
          <div class="form-group">
            <label>Nhu cầu học *</label>
            <select name="title" required>
              <option value="">-- Chọn nhu cầu học --</option>
              <option>Network Foundation</option>
              <option>Switching & VLAN</option>
              <option>Routing & Internet Edge</option>
              <option>Firewall & VPN Basic</option>
              <option>WiFi & Office Network</option>
              <option>Mentor 1:1</option>
            </select>
          </div>
          <div class="form-group"><label>Mục tiêu học và trình độ hiện tại *</label><textarea name="description" rows="6" required></textarea></div>
          <div class="form-group">
            <label>Mức độ cần tư vấn</label>
            <select name="priority"><option value="medium">Cần tư vấn trong tuần</option><option value="high">Muốn học sớm</option><option value="urgent">Cần kèm gấp</option><option value="low">Tham khảo trước</option></select>
          </div>
          <button class="btn-primary" type="submit">Gửi đăng ký học</button>
          <div class="form-message" data-form-message style="display:none"></div>
        </form>
      </div>
    </section>
  </main>
  <script src="/js/main.js"></script>
</body>
</html>
